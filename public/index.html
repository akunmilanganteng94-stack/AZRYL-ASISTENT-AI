<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZRYL AI - Powered by azrylasissten</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header glass-panel">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>
          <circle cx="9" cy="10" r="1"/>
          <circle cx="15" cy="10" r="1"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">AZRYL AI</h1>
        <p class="brand-subtitle">Powered by azrylasissten</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-pill" id="clearBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
        Bersihkan Chat
      </button>
    </div>
  </header>

  <main class="main-layout">
    <div class="chat-history" id="chatHistory">
      <div class="message-row ai">
        <div class="bubble">
          Halo! Saya adalah <strong>azrylasissten</strong>, asisten AI resmi yang dikembangkan oleh <strong>AZRYL</strong>. Ada yang bisa saya bantu hari ini?
        </div>
      </div>
    </div>

    <div class="quick-prompts">
      <button class="prompt-chip" onclick="askPrompt('kamu siapa?')">✨ Kamu siapa?</button>
      <button class="prompt-chip" onclick="askPrompt('siapa pembuatmu?')">👨‍💻 Siapa pembuatmu?</button>
      <button class="prompt-chip" onclick="askPrompt('Bantu saya buat ide website modern')">💡 Ide Website</button>
      <button class="prompt-chip" onclick="askPrompt('Jelaskan fungsi async/await di JavaScript')">⚡ Coding Help</button>
    </div>

    <div class="chat-input-area">
      <div class="input-box-wrapper">
        <textarea id="userInput" placeholder="Ketik pesan untuk azrylasissten..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
